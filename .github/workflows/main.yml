name: Build NobiTerm Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra-improvs
          fetch-depth: 0

      - name: Setup Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/lib"

          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d "$HOME/lib"
          rm android-ndk-r29-linux.zip

          ls -la "$HOME/lib/android-ndk-r29"

      - name: Build bootstrap
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: nobiterm-bootstrap-aarch64
          path: bootstrap-aarch64.zip
