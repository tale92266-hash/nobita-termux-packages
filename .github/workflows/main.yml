name: Build NobiTerm Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra-improvs
          fetch-depth: 0

      - name: Check NDK
        run: |
          docker run --rm ghcr.io/termux/package-builder:latest bash -lc '
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
            echo "NDK=$NDK"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "Available NDK directories:"
            ls -la "$ANDROID_HOME/ndk" 2>/dev/null || true
            echo "Searching for Android NDK:"
            find /opt /usr/local /home -maxdepth 5 -type d -name "android-ndk*" 2>/dev/null | head -20
          '

      - name: Build bootstrap
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: nobiterm-bootstrap-aarch64
          path: bootstrap-aarch64.zip
