name: Build NobiTerm Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra-improvs
          fetch-depth: 0

      - name: Build package builder image
        run: |
          docker build -t nobita-package-builder ./scripts

      - name: Verify package builder
        run: |
          docker image inspect nobita-package-builder
          docker run --rm nobita-package-builder bash -lc '
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK=$NDK"
            ls -ld "$NDK" || true
          '

      - name: Build bootstrap
        run: |
          chmod +x scripts/*.sh
          TERMUX_BUILDER_IMAGE_NAME=nobita-package-builder \
          CONTAINER_NAME=nobita-package-builder \
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Check bootstrap
        run: |
          ls -lh bootstrap-aarch64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nobiterm-bootstrap-aarch64
          path: bootstrap-aarch64.zip
