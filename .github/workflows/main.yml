name: Build NobiTerm Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: infra-improvs
          fetch-depth: 0

      - name: Build package builder image
        run: |
          docker build -t nobita-package-builder ./scripts

      - name: Verify image
        run: |
          docker image inspect nobita-package-builder
          docker run --rm nobita-package-builder bash -lc '
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK=$NDK"
            test -d "$NDK"
          '

      - name: Start builder container
        run: |
          docker run -d \
            --name nobita-builder \
            --volume "$GITHUB_WORKSPACE:/home/builder/termux-packages" \
            --workdir /home/builder/termux-packages \
            nobita-package-builder \
            tail -f /dev/null

      - name: Build bootstrap
        run: |
          docker exec nobita-builder \
            bash -lc '
              chmod +x scripts/*.sh
              ./scripts/build-bootstraps.sh --architectures aarch64
            '

      - name: Check bootstrap
        run: |
          ls -lh bootstrap-aarch64.zip
          test -f bootstrap-aarch64.zip

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: nobiterm-bootstrap-aarch64
          path: bootstrap-aarch64.zip
